[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factec"
version = "1.6.1"
description = "Facturación electrónica de Ecuador (SRI): clave de acceso, XML de todos los comprobantes, firma XAdES-BES y envío SOAP."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jurdin32", email = "jurdin32@users.noreply.github.com" }]
keywords = ["sri", "ecuador", "facturacion", "electronica", "xades", "comprobantes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=41.0",
  "lxml>=4.9",
  "requests>=2.28",
]

[project.optional-dependencies]
django = ["Django>=4.2", "celery>=5.3"]
dev = ["pytest>=7.0", "pytest-cov", "signxml>=3.0", "Django>=4.2", "celery>=5.3"]

[project.urls]
Homepage = "https://github.com/jurdin32/factec"
Documentation = "https://github.com/jurdin32/factec#readme"
Repositorio = "https://github.com/jurdin32/factec.git"
Seguimiento = "https://github.com/jurdin32/factec/issues"

[project.scripts]
sri-fe = "factec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factec = ["py.typed"]
"factec.django" = [
    "migrations/*.py",
    "static/sri_fe/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "xsd: la prueba necesita los XSD oficiales del SRI (variable SRI_XSD_DIR)",
]
filterwarnings = [
  "ignore::DeprecationWarning:cryptography.*",
]
