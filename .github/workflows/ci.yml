name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Las versiones que declara el paquete (requires-python = ">=3.9").
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: XSD oficiales del SRI
        # Fijados a un commit concreto y con la huella comprobada: si el origen no
        # coincide, esto falla aquí en vez de validar contra otra cosa.
        run: ./tests/descargar_xsd.sh "$RUNNER_TEMP/xsd"

      - name: Pruebas
        env:
          SRI_XSD_DIR: ${{ runner.temp }}/xsd
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.txt"
          # En CI no se salta nada: si una prueba se salta (por ejemplo porque
          # falta un XSD) el trabajo falla en vez de salir verde mintiendo.
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::Alguna prueba se saltó; vea el motivo arriba."
            exit 1
          fi

      - name: Resumen
        run: python -c "import sys, factec; print(sys.version.split()[0], '· factec', factec.__version__)"

  paquete:
    name: Paquete (wheel y sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Construir
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: El paquete lleva todo lo que promete
        run: python tests/comprobar_paquete.py dist/*.whl

      - name: Instalarlo en un entorno limpio y probar la consola
        run: |
          python -m venv "$RUNNER_TEMP/limpio"
          "$RUNNER_TEMP/limpio/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/limpio/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/limpio/bin/python" -c "import factec; print('factec', factec.__version__)"
          "$RUNNER_TEMP/limpio/bin/sri-fe" --help > /dev/null
          # La clave de acceso, sin Django ni red: tiene que salir de 49 dígitos.
          clave="$("$RUNNER_TEMP/limpio/bin/sri-fe" clave --tipo 01 --ruc 0703886697001 \
                   --serie 001001 --secuencial 1 --codigo 12345678)"
          echo "clave: $clave"
          test "${#clave}" -eq 49

      - name: "Con Django: migrar y arrancar"
        run: |
          "$RUNNER_TEMP/limpio/bin/pip" install "$(ls dist/*.whl)[django]"
          "$RUNNER_TEMP/limpio/bin/python" tests/humo_django.py
